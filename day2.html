<!doctype html>

<style>
:root{--bg:#f4f4f1;--card:#fff;--fg:#1d2221;--sub:#5b6461;--line:#d9dcd6;--ac:#1f6b5f;--ac2:#b5652a;--tint:#e8f2ef}
@media (prefers-color-scheme:dark){:root{--bg:#141817;--card:#1c2120;--fg:#e6ebe9;--sub:#9aa4a1;--line:#2e3533;--ac:#5cc2ae;--ac2:#e39a63;--tint:#1d2b28}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 "IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif}
main{max-width:880px;margin:0 auto;padding:48px max(16px,env(safe-area-inset-left)) 64px}
.eyebrow{color:var(--sub);font-size:14px;margin:0}
h1{font-size:34px;line-height:1.25;margin:6px 0 10px;text-wrap:balance}
.lead{color:var(--sub);margin:0 0 28px}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
a.day{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ac);border-radius:12px;padding:20px 22px}
a.day.d2{border-left-color:var(--ac2)}
a.day:hover{border-color:var(--ac)}
.day .when{color:var(--sub);font-size:14px}
.day b{display:block;font-size:22px;margin:4px 0 6px}
.day ul{margin:8px 0 0;padding-left:18px;color:var(--sub);font-size:15px}
.start{margin-top:24px;background:var(--tint);border-radius:12px;padding:16px 20px}
.start a{color:var(--ac);font-weight:600}
code{font-family:"JetBrains Mono",Consolas,monospace;font-size:.92em}
.foot{margin-top:28px;color:var(--sub);font-size:13px}
</style></head><body><main>
